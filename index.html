        out += &#x27;&lt;text x=&quot;&#x27; + (W-padR+5) + &#x27;&quot; y=&quot;&#x27; + (y+3.5) + &#x27;&quot; text-anchor=&quot;start&quot; fill=&quot;#facc15&quot; font-size=&quot;9&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + p + &#x27;p&lt;/text&gt;&#x27;;
      });
      const midY = padT + innerH / 2;
      out += &#x27;&lt;text x=&quot;12&quot; y=&quot;&#x27; + midY + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#9cb0c7&quot; font-size=&quot;9.5&quot; font-weight=&quot;700&quot; transform=&quot;rotate(-90 12 &#x27; + midY + &#x27;)&quot;&gt;Hogares asignados por programa&lt;/text&gt;&#x27;;
      out += &#x27;&lt;text x=&quot;&#x27; + (W - 11) + &#x27;&quot; y=&quot;&#x27; + midY + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#fde047&quot; font-size=&quot;9&quot; font-weight=&quot;700&quot; transform=&quot;rotate(90 &#x27; + (W - 11) + &#x27; &#x27; + midY + &#x27;)&quot;&gt;Personal (Planta + OPS)&lt;/text&gt;&#x27;;
      out += &#x27;&lt;text x=&quot;&#x27; + (padL + innerW / 2) + &#x27;&quot; y=&quot;&#x27; + (H - 5) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#9cb0c7&quot; font-size=&quot;9.5&quot; font-weight=&quot;700&quot;&gt;Año / Vigencia (desglose por programa)&lt;/text&gt;&#x27;;

      const colW = innerW / series.length;
      const subW = Math.min(16, (colW - 18) / 3);
      const ptsPers = [];
      series.forEach((d, i) =&gt; {
        const cx = padL + i * colW + colW / 2;
        const arrOrSem = d.arr + d.sem;
        const bars = [
          { v: d.adq, col: &quot;#22d3ee&quot;, lbl: (d.adq &gt;= 1000 ? (d.adq/1000).toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)+&quot;k&quot; : String(d.adq)), m: d.adqM, nm: &quot;Adquisición&quot; },
          { v: d.mej, col: &quot;#c084fc&quot;, lbl: (d.mej &gt;= 1000 ? (d.mej/1000).toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)+&quot;k&quot; : String(d.mej)), m: d.mejM, nm: &quot;Mejoramiento&quot; },
          { v: arrOrSem, col: &quot;#34d399&quot;, lbl: (arrOrSem &gt;= 1000 ? (arrOrSem/1000).toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)+&quot;k&quot; : String(arrOrSem)), m: d.arrM, nm: (d.sem &gt; 0 ? &quot;Semilleros&quot; : &quot;Arrendamiento&quot;) }
        ];
        const startX = cx - (bars.length * subW + 4) / 2;
        const yTip = escAttr(makeYearTip(d));
        bars.forEach((b, bi) =&gt; {
          const bx = startX + bi * (subW + 2);
          const by = yHog(b.v);
          const bh = Math.max(b.v &gt; 0 ? 3 : 0, yHog(0) - by);
          out += &#x27;&lt;g data-tip=&quot;&#x27; + yTip + &#x27;&quot; onmousemove=&quot;showTipEl(event, this)&quot; onmouseleave=&quot;hideTip()&quot; style=&quot;cursor:pointer&quot;&gt;&#x27;;
          out += &#x27;&lt;rect x=&quot;&#x27; + bx + &#x27;&quot; y=&quot;&#x27; + by + &#x27;&quot; width=&quot;&#x27; + subW + &#x27;&quot; height=&quot;&#x27; + bh + &#x27;&quot; rx=&quot;2&quot; fill=&quot;&#x27; + b.col + &#x27;&quot; opacity=&quot;0.9&quot;/&gt;&#x27;;
          if(b.v &gt;= 800){
            out += &#x27;&lt;text x=&quot;&#x27; + (bx + subW/2) + &#x27;&quot; y=&quot;&#x27; + (by - 4) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;&#x27; + b.col + &#x27;&quot; font-size=&quot;8&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + b.lbl + &#x27;&lt;/text&gt;&#x27;;
          }
          out += &#x27;&lt;/g&gt;&#x27;;
        });
        out += &#x27;&lt;text x=&quot;&#x27; + cx + &#x27;&quot; y=&quot;&#x27; + (H - 22) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;&#x27; + (d.prop ? &quot;#34d399&quot; : &quot;#9cb0c7&quot;) + &#x27;&quot; font-size=&quot;10&quot; font-weight=&quot;&#x27; + (d.prop ? &quot;700&quot; : &quot;600&quot;) + &#x27;&quot;&gt;&#x27; + d.yr + &#x27;&lt;/text&gt;&#x27;;
        const totP = d.planta + d.ops;
        ptsPers.push({ cx, y: yPers(totP), totP, tipHtml: yTip });
      });
      out += &#x27;&lt;polyline fill=&quot;none&quot; stroke=&quot;#facc15&quot; stroke-width=&quot;2.2&quot; points=&quot;&#x27; + ptsPers.map(p =&gt; p.cx + &quot;,&quot; + p.y).join(&quot; &quot;) + &#x27;&quot;/&gt;&#x27;;
      ptsPers.forEach(p =&gt; {
        out += &#x27;&lt;circle cx=&quot;&#x27; + p.cx + &#x27;&quot; cy=&quot;&#x27; + p.y + &#x27;&quot; r=&quot;4.5&quot; fill=&quot;#facc15&quot; stroke=&quot;#0e131a&quot; stroke-width=&quot;1.2&quot; data-tip=&quot;&#x27; + p.tipHtml + &#x27;&quot; onmousemove=&quot;showTipEl(event, this)&quot; onmouseleave=&quot;hideTip()&quot; style=&quot;cursor:pointer&quot;&gt;&lt;/circle&gt;&#x27;;
        out += &#x27;&lt;rect x=&quot;&#x27; + (p.cx - 15) + &#x27;&quot; y=&quot;&#x27; + (p.y - 18) + &#x27;&quot; width=&quot;30&quot; height=&quot;12&quot; rx=&quot;3&quot; fill=&quot;rgba(14,19,26,0.88)&quot;/&gt;&#x27;;
        out += &#x27;&lt;text x=&quot;&#x27; + p.cx + &#x27;&quot; y=&quot;&#x27; + (p.y - 9) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#fde047&quot; font-size=&quot;9.5&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + p.totP + &#x27;p&lt;/text&gt;&#x27;;
      });
      svg.innerHTML = out;
      return;
    }

    if(legendEl){
      legendEl.innerHTML =
        &#x27;&lt;span&gt;&lt;span class=&quot;hist-dot&quot; style=&quot;background:var(--structure)&quot;&gt;&lt;/span&gt;Planta (12)&lt;/span&gt;&#x27; +
        &#x27;&lt;span&gt;&lt;span class=&quot;hist-dot&quot; style=&quot;background:var(--terra)&quot;&gt;&lt;/span&gt;OPS (2022–26)&lt;/span&gt;&#x27; +
        &#x27;&lt;span&gt;&lt;span class=&quot;hist-dot&quot; style=&quot;background:var(--good)&quot;&gt;&lt;/span&gt;OPS 2027&lt;/span&gt;&#x27; +
        &#x27;&lt;span&gt;&lt;span class=&quot;hist-dot&quot; style=&quot;background:#facc15;border-radius:50%&quot;&gt;&lt;/span&gt;Hogares (k)&lt;/span&gt;&#x27; +
        &#x27;&lt;span&gt;&lt;span class=&quot;hist-dot&quot; style=&quot;background:#e879f9;border-radius:50%&quot;&gt;&lt;/span&gt;Inversión ($B)&lt;/span&gt;&#x27;;
    }
    const maxPers = 150;
    const maxHog = 62000;
    const maxCop = 1.95;
    const yPers = v =&gt; padT + innerH - (v / maxPers) * innerH;
    const yHog = v =&gt; padT + innerH - (v / maxHog) * innerH;
    const yCop = v =&gt; padT + innerH - (v / maxCop) * innerH;

    let out = &quot;&quot;;
    [0, 35, 70, 105, 140].forEach(t =&gt; {
      const y = yPers(t);
      out += &#x27;&lt;line x1=&quot;&#x27; + padL + &#x27;&quot; y1=&quot;&#x27; + y + &#x27;&quot; x2=&quot;&#x27; + (W-padR) + &#x27;&quot; y2=&quot;&#x27; + y + &#x27;&quot; stroke=&quot;rgba(130,190,235,0.12)&quot; stroke-dasharray=&quot;3,3&quot;/&gt;&#x27;;
      out += &#x27;&lt;text x=&quot;&#x27; + (padL-5) + &#x27;&quot; y=&quot;&#x27; + (y+3.5) + &#x27;&quot; text-anchor=&quot;end&quot; fill=&quot;#687d96&quot; font-size=&quot;9.5&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + t + &#x27;&lt;/text&gt;&#x27;;
    });
    // Right axis ticks (Hogares miles)
    [0, 20, 40, 60].forEach(k =&gt; {
      const y = yHog(k * 1000);
      out += &#x27;&lt;text x=&quot;&#x27; + (W-padR+5) + &#x27;&quot; y=&quot;&#x27; + (y+3.5) + &#x27;&quot; text-anchor=&quot;start&quot; fill=&quot;#facc15&quot; font-size=&quot;9&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + k + &#x27;k&lt;/text&gt;&#x27;;
    });
    // Axis Titles
    const midY = padT + innerH / 2;
    out += &#x27;&lt;text x=&quot;12&quot; y=&quot;&#x27; + midY + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#9cb0c7&quot; font-size=&quot;9.5&quot; font-weight=&quot;700&quot; transform=&quot;rotate(-90 12 &#x27; + midY + &#x27;)&quot;&gt;Personas (Planta + OPS)&lt;/text&gt;&#x27;;
    out += &#x27;&lt;text x=&quot;&#x27; + (W - 11) + &#x27;&quot; y=&quot;&#x27; + midY + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#fde047&quot; font-size=&quot;9&quot; font-weight=&quot;700&quot; transform=&quot;rotate(90 &#x27; + (W - 11) + &#x27; &#x27; + midY + &#x27;)&quot;&gt;Hogares (k) / Inversión ($B)&lt;/text&gt;&#x27;;
    out += &#x27;&lt;text x=&quot;&#x27; + (padL + innerW / 2) + &#x27;&quot; y=&quot;&#x27; + (H - 5) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#9cb0c7&quot; font-size=&quot;9.5&quot; font-weight=&quot;700&quot;&gt;Año / Vigencia&lt;/text&gt;&#x27;;

    const colW = innerW / series.length;
    const barW = Math.min(48, colW * 0.50);
    const ptsHog = [];
    const ptsCop = [];

    series.forEach((d, i) =&gt; {
      const cx = padL + i * colW + colW / 2;
      const x = cx - barW / 2;
      const tot = d.planta + d.ops;
      const yPl = yPers(d.planta);
      const hPl = yPers(0) - yPl;
      const yTot = yPers(tot);
      const hOps = yPl - yTot;
      const opsColor = d.prop ? &quot;#68b89a&quot; : &quot;#d4a373&quot;;
      const yTip = escAttr(makeYearTip(d));
      out += &#x27;&lt;g data-tip=&quot;&#x27; + yTip + &#x27;&quot; onmousemove=&quot;showTipEl(event, this)&quot; onmouseleave=&quot;hideTip()&quot; style=&quot;cursor:pointer&quot;&gt;&#x27;;
      out += &#x27;&lt;rect x=&quot;&#x27; + x + &#x27;&quot; y=&quot;&#x27; + yPl + &#x27;&quot; width=&quot;&#x27; + barW + &#x27;&quot; height=&quot;&#x27; + hPl + &#x27;&quot; rx=&quot;2&quot; fill=&quot;#38bdf8&quot; opacity=&quot;0.88&quot;/&gt;&#x27;;
      out += &#x27;&lt;rect x=&quot;&#x27; + x + &#x27;&quot; y=&quot;&#x27; + yTot + &#x27;&quot; width=&quot;&#x27; + barW + &#x27;&quot; height=&quot;&#x27; + hOps + &#x27;&quot; rx=&quot;2&quot; fill=&quot;&#x27; + opsColor + &#x27;&quot; opacity=&quot;0.82&quot;/&gt;&#x27;;
      out += &#x27;&lt;text x=&quot;&#x27; + cx + &#x27;&quot; y=&quot;&#x27; + (yTot - 6) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;&#x27; + (d.prop ? &quot;#68b89a&quot; : &quot;#e8eff7&quot;) + &#x27;&quot; font-size=&quot;10.5&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + tot + &#x27;p&lt;/text&gt;&#x27;;
      if(hOps &gt; 14){
        const yOpsLbl = (d.prop || d.ops &gt;= 115) ? (yTot + 16) : (d.ops &gt;= 90 ? (yPl - 6) : (yTot + hOps/2 + 3.5));
        out += &#x27;&lt;text x=&quot;&#x27; + cx + &#x27;&quot; y=&quot;&#x27; + yOpsLbl + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#0e131a&quot; font-size=&quot;10&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + d.ops + &#x27;&lt;/text&gt;&#x27;;
      }
      out += &#x27;&lt;text x=&quot;&#x27; + cx + &#x27;&quot; y=&quot;&#x27; + (yPers(0) - hPl/2 + 3.5) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#0e131a&quot; font-size=&quot;9&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;12&lt;/text&gt;&#x27;;
      out += &#x27;&lt;text x=&quot;&#x27; + cx + &#x27;&quot; y=&quot;&#x27; + (H - 22) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;&#x27; + (d.prop ? &quot;#68b89a&quot; : &quot;#9cb0c7&quot;) + &#x27;&quot; font-size=&quot;10&quot; font-weight=&quot;&#x27; + (d.prop ? &quot;700&quot; : &quot;600&quot;) + &#x27;&quot;&gt;&#x27; + d.yr + &#x27;&lt;/text&gt;&#x27;;
      out += &#x27;&lt;/g&gt;&#x27;;
      ptsHog.push({ cx, y: yHog(d.hog), val: (d.hog/1000).toFixed(1).replace(&quot;.&quot;, &quot;,&quot;) + &quot;k&quot;, yTip });
      ptsCop.push({ cx, y: yCop(d.copB), val: &quot;$&quot; + d.copB.toFixed(2).replace(&quot;.&quot;, &quot;,&quot;) + &quot;B&quot;, yTip });
    });

    // Linear 12 Planta reference line
    const yP12 = yPers(12);
    out += &#x27;&lt;line x1=&quot;&#x27; + padL + &#x27;&quot; y1=&quot;&#x27; + yP12 + &#x27;&quot; x2=&quot;&#x27; + (W-padR) + &#x27;&quot; y2=&quot;&#x27; + yP12 + &#x27;&quot; stroke=&quot;#38bdf8&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4,3&quot;/&gt;&#x27;;

    // Line 1: Hogares asignados (#facc15)
    out += &#x27;&lt;polyline fill=&quot;none&quot; stroke=&quot;#facc15&quot; stroke-width=&quot;2.4&quot; points=&quot;&#x27; + ptsHog.map(p =&gt; p.cx + &quot;,&quot; + p.y).join(&quot; &quot;) + &#x27;&quot;/&gt;&#x27;;
    // Line 2: Inversión $ Billones (#e879f9)
    out += &#x27;&lt;polyline fill=&quot;none&quot; stroke=&quot;#e879f9&quot; stroke-width=&quot;2.2&quot; stroke-dasharray=&quot;5,3&quot; points=&quot;&#x27; + ptsCop.map(p =&gt; p.cx + &quot;,&quot; + p.y).join(&quot; &quot;) + &#x27;&quot;/&gt;&#x27;;

    ptsHog.forEach((p, idx) =&gt; {
      out += &#x27;&lt;circle cx=&quot;&#x27; + p.cx + &#x27;&quot; cy=&quot;&#x27; + p.y + &#x27;&quot; r=&quot;4.5&quot; fill=&quot;#facc15&quot; stroke=&quot;#0e131a&quot; stroke-width=&quot;1.2&quot; data-tip=&quot;&#x27; + p.yTip + &#x27;&quot; onmousemove=&quot;showTipEl(event, this)&quot; onmouseleave=&quot;hideTip()&quot; style=&quot;cursor:pointer&quot;&gt;&lt;/circle&gt;&#x27;;
      const dx = idx === 3 ? 24 : (idx === 5 ? -22 : 0);
      const dy = idx === 3 ? 3 : -9;
      out += &#x27;&lt;rect x=&quot;&#x27; + (p.cx + dx - 18) + &#x27;&quot; y=&quot;&#x27; + (p.y + dy - 9) + &#x27;&quot; width=&quot;36&quot; height=&quot;12&quot; rx=&quot;3&quot; fill=&quot;rgba(14,19,26,0.88)&quot;/&gt;&#x27;;
      out += &#x27;&lt;text x=&quot;&#x27; + (p.cx + dx) + &#x27;&quot; y=&quot;&#x27; + (p.y + dy) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#fde047&quot; font-size=&quot;9.5&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + p.val + &#x27;&lt;/text&gt;&#x27;;
    });
    ptsCop.forEach((p, idx) =&gt; {
      out += &#x27;&lt;circle cx=&quot;&#x27; + p.cx + &#x27;&quot; cy=&quot;&#x27; + p.y + &#x27;&quot; r=&quot;4.2&quot; fill=&quot;#e879f9&quot; stroke=&quot;#0e131e&quot; stroke-width=&quot;1.2&quot; data-tip=&quot;&#x27; + p.yTip + &#x27;&quot; onmousemove=&quot;showTipEl(event, this)&quot; onmouseleave=&quot;hideTip()&quot; style=&quot;cursor:pointer&quot;&gt;&lt;/circle&gt;&#x27;;
      const dx = idx === 0 ? 26 : (idx === 5 ? 24 : 0);
      const dy = idx === 0 ? 3 : (idx === 5 ? -9 : 13);
      out += &#x27;&lt;rect x=&quot;&#x27; + (p.cx + dx - 20) + &#x27;&quot; y=&quot;&#x27; + (p.y + dy - 9) + &#x27;&quot; width=&quot;40&quot; height=&quot;12&quot; rx=&quot;3&quot; fill=&quot;rgba(14,19,26,0.85)&quot;/&gt;&#x27;;
      out += &#x27;&lt;text x=&quot;&#x27; + (p.cx + dx) + &#x27;&quot; y=&quot;&#x27; + (p.y + dy) + &#x27;&quot; text-anchor=&quot;middle&quot; fill=&quot;#f0abfc&quot; font-size=&quot;9&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot;&gt;&#x27; + p.val + &#x27;&lt;/text&gt;&#x27;;
    });

    svg.innerHTML = out;
  }

  function renderCards(){
    const list = PEOPLE.filter(p =&gt; {
      if(currentMode === &quot;strict&quot; &amp;&amp; !active[p.id]) return false;
      if(selectedGroup &amp;&amp; p.grupo !== selectedGroup &amp;&amp; p.grupo !== &quot;Dirección&quot;) return false;
      return true;
    });

    document.getElementById(&quot;countVisible&quot;).textContent = &quot;Mostrando &quot; + list.length + &quot; cargos/roles&quot;;
    const grid = document.getElementById(&quot;cardsGrid&quot;);

    function chipHtml(p){
      const isOn = !!active[p.id];
      const cls = &quot;p-chip &quot; + (p.isPlanta ? &quot;planta&quot; : (isOn ? &quot;ops&quot; : &quot;cut&quot;));
      const tag = p.isPlanta
        ? &#x27;&lt;span class=&quot;pill-tag pill-planta&quot;&gt;Planta&lt;/span&gt;&#x27;
        : &#x27;&lt;span class=&quot;pill-tag &#x27; + (isOn ? &#x27;pill-ops&#x27; : &#x27;pill-cut&#x27;) + &#x27;&quot; onclick=&quot;togglePerson(\&#x27;&#x27; + p.id + &#x27;\&#x27;)&quot;&gt;&#x27; + (isOn ? &#x27;OPS&#x27; : &#x27;Sale&#x27;) + &#x27;&lt;/span&gt;&#x27;;
      const safeName = p.displayName.replace(/&amp;/g, &quot;&amp;amp;&quot;).replace(/&lt;/g, &quot;&amp;lt;&quot;);
      const safeFn = p.funcion.replace(/&amp;/g, &quot;&amp;amp;&quot;).replace(/&lt;/g, &quot;&amp;lt;&quot;);
      const chipTip = escAttr(&#x27;&lt;div class=&quot;tip-t&quot;&gt;&#x27; + safeName + &#x27;&lt;/div&gt;&lt;div class=&quot;tip-r&quot;&gt;&lt;span&gt;Subgrupo:&lt;/span&gt;&lt;b&gt;&#x27; + p.subgrupo + &#x27;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;tip-r&quot;&gt;&lt;span&gt;Vínculo:&lt;/span&gt;&lt;b&gt;&#x27; + (p.isPlanta ? &#x27;Planta&#x27; : &#x27;OPS&#x27;) + &#x27;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;tip-p&quot;&gt;&#x27; + safeFn + &#x27;&lt;/div&gt;&#x27;);
      return &#x27;&lt;div class=&quot;&#x27; + cls + &#x27;&quot; data-tip=&quot;&#x27; + chipTip + &#x27;&quot; onmousemove=&quot;showTipEl(event, this)&quot; onmouseleave=&quot;hideTip()&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;p-chip-top&quot;&gt;&lt;span class=&quot;p-name&quot;&gt;&#x27; + p.displayName + &#x27;&lt;/span&gt;&#x27; + tag + &#x27;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;p-func&quot;&gt;&#x27; + p.funcion + &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;/div&gt;&#x27;;
    }

    const FULL_ORDER = [
      &quot;Dirección&quot;,
      &quot;Grupo de Gobierno y Soporte del Ciclo del Subsidio&quot;,
      &quot;Grupo de Asignación y Gestión Operativa del Subsidio Familiar de Vivienda&quot;,
      &quot;Grupo de Pagos, Legalización y Cierre del Subsidio Familiar&quot;
    ];

    let htmlOut = &quot;&quot;;
    FULL_ORDER.forEach(grp =&gt; {
      if(selectedGroup &amp;&amp; grp !== selectedGroup &amp;&amp; grp !== &quot;Dirección&quot;) return;
      const grpItems = list.filter(p =&gt; p.grupo === grp);
      if(!grpItems.length) return;
      if(grp === &quot;Dirección&quot;){
        htmlOut += &#x27;&lt;div class=&quot;org-dir&quot;&gt;&#x27; +
          &#x27;&lt;div&gt;&lt;div class=&quot;org-group-title&quot;&gt;Subdirección de Subsidio Familiar de Vivienda&lt;/div&gt;&lt;div class=&quot;p-func&quot;&gt;&#x27; + grpItems[0].displayName + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;span class=&quot;pill-tag pill-planta&quot;&gt;Planta (Dirección)&lt;/span&gt;&#x27; +
        &#x27;&lt;/div&gt;&#x27;;
        return;
      }
      const subNames = [...new Set(grpItems.map(p =&gt; p.subgrupo))];
      const isGob = grp.includes(&quot;Gobierno&quot;);
      const isPagosGrp = grp.includes(&quot;Pagos&quot;);
      const subsGridCls = isGob ? &quot;org-subgroups cols-7&quot; : (isPagosGrp ? &quot;org-subgroups cols-6&quot; : &quot;org-subgroups&quot;);
      const subsHtml = subNames.map(sub =&gt; {
        const subItems = grpItems.filter(p =&gt; p.subgrupo === sub);
        const isSpan3 = isPagosGrp &amp;&amp; subItems.length &gt;= 10;
        const isSpan2 = !isGob &amp;&amp; !isSpan3 &amp;&amp; subItems.length &gt;= 6;
        const spanCls = isSpan3 ? &quot; span-3&quot; : (isSpan2 ? &quot; span-2&quot; : &quot;&quot;);
        const colCls = isSpan3 ? &quot;cards-col-3&quot; : (isSpan2 ? &quot;cards-col-2&quot; : &quot;cards-col&quot;);
        return &#x27;&lt;div class=&quot;org-subgroup&#x27; + spanCls + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;div class=&quot;org-sub-head&quot;&gt;&lt;span class=&quot;org-sub-title&quot;&gt;&#x27; + sub + &#x27;&lt;/span&gt;&lt;span class=&quot;org-sub-count&quot;&gt;&#x27; + subItems.length + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;div class=&quot;&#x27; + colCls + &#x27;&quot;&gt;&#x27; + subItems.map(chipHtml).join(&quot;&quot;) + &#x27;&lt;/div&gt;&#x27; +
        &#x27;&lt;/div&gt;&#x27;;
      }).join(&quot;&quot;);
      htmlOut += &#x27;&lt;div class=&quot;org-group&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;org-group-head&quot;&gt;&lt;span class=&quot;org-group-title&quot;&gt;&#x27; + grp + &#x27;&lt;/span&gt;&lt;span class=&quot;org-sub-count&quot;&gt;&#x27; + grpItems.length + &#x27; cargos/roles&lt;/span&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;&#x27; + subsGridCls + &#x27;&quot;&gt;&#x27; + subsHtml + &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;/div&gt;&#x27;;
    });
    grid.innerHTML = htmlOut;
  }

  function renderAll(){
    renderKPIs();
    renderSummary();
    renderHistChart();
    renderCards();
  }

  renderGroupButtons();
  applyPreset(&quot;strict&quot;);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>

<script>
(function(){
  "use strict";
  try{ window.mvctAlloc = JSON.parse(localStorage.getItem("mvct_housing_budget_allocation") || "null"); } catch(e){ window.mvctAlloc = null; }
  window.mvctSetAlloc = function(alloc){
    window.mvctAlloc = alloc;
    try{ localStorage.setItem("mvct_housing_budget_allocation", JSON.stringify(alloc)); } catch(e){}
  };
  function mvctShowView(key, forceReload){
    document.querySelectorAll(".mvct-frame").forEach(function(f){ f.classList.remove("active"); });
    document.querySelectorAll(".mvct-tab").forEach(function(b){ b.classList.remove("active"); });
    var frame = document.getElementById("frame-" + key);
    var tab = document.querySelector('.mvct-tab[data-key="' + key + '"]');
    if (frame){
      var alloc = window.mvctAlloc;
      if (!alloc){ try{ alloc = JSON.parse(localStorage.getItem("mvct_housing_budget_allocation") || "null"); } catch(e){} }
      if (alloc && frame.contentWindow && typeof frame.contentWindow.mvctApplyAlloc === "function"){
        try { frame.contentWindow.mvctApplyAlloc(alloc); } catch(e){}
      } else if (forceReload){
        try { frame.contentWindow.location.reload(); } catch(e){}
      }
      frame.classList.add("active");
    }
    if (tab) tab.classList.add("active");
  }
  window.mvctShowView = mvctShowView;
  document.querySelectorAll(".mvct-tab").forEach(function(btn){
    btn.addEventListener("click", function(){ mvctShowView(btn.dataset.key); });
  });
  mvctShowView("portada");
})();
</script>
