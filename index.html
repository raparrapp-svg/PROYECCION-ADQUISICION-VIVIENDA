  function rebalance(changedKey, rawNewVal){
    if(locked[changedKey]){ render(); return; }
    const lockedSum = KEYS.filter(k =&gt; k !== changedKey &amp;&amp; locked[k]).reduce((s, k) =&gt; s + pct[k], 0);
    const maxAllowed = Math.max(0, 100 - lockedSum);
    const newVal = clamp(rawNewVal, 0, maxAllowed);
    const unlockedOthers = KEYS.filter(k =&gt; k !== changedKey &amp;&amp; !locked[k]);
    pct[changedKey] = newVal;

    if(unlockedOthers.length === 0){
      pct[changedKey] = maxAllowed;
    } else {
      const targetRest = 100 - lockedSum - newVal;
      const curRest = unlockedOthers.reduce((s, k) =&gt; s + pct[k], 0);
      if(curRest &lt;= 0.0001){
        unlockedOthers.forEach(k =&gt; { pct[k] = targetRest / unlockedOthers.length; });
      } else {
        unlockedOthers.forEach(k =&gt; { pct[k] = (pct[k] / curRest) * targetRest; });
      }
    }
    render();
    saveAllocation();
  }

  function totalM(){ return Math.max(0, Number($(&quot;totalNum&quot;).value) || 0); }

  function render(){
    const total = totalM();
    KEYS.forEach(k =&gt; {
      const c = CAP[k];
      const rounded = Math.round(pct[k]);
      $(&quot;slider&quot; + c).value = rounded;
      if(document.activeElement !== $(&quot;pctIn&quot; + c)) $(&quot;pctIn&quot; + c).value = rounded;
      if(document.activeElement !== $(&quot;abs&quot; + c)) $(&quot;abs&quot; + c).value = Math.round(total * pct[k] / 100);
      $(&quot;donutTxt&quot; + c).textContent = rounded + &quot;%&quot;;
      const deg = (rounded * 3.6).toFixed(1);
      $(&quot;donut&quot; + c).style.background = &quot;conic-gradient(&quot; + COLORS[k] + &quot; &quot; + deg + &quot;deg, rgba(255,255,255,0.09) 0)&quot;;
    });
  }

  function saveAllocation(){
    const total = totalM();
    const alloc = {
      total,
      pctAdq: pct.adq, pctMej: pct.mej, pctSem: pct.sem,
      mAdq: Math.round(total * pct.adq / 100),
      mMej: Math.round(total * pct.mej / 100),
      mSem: Math.round(total * pct.sem / 100),
      savedAt: new Date().toISOString()
    };
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(alloc)); } catch(e){}
    if(window.parent &amp;&amp; window.parent.mvctSetAlloc){ window.parent.mvctSetAlloc(alloc); }
    updateSavedNote();
    return alloc;
  }

  window.mvctApplyAlloc = function(alloc){
    if(!alloc) return;
    if(typeof alloc.total === &quot;number&quot; &amp;&amp; alloc.total &gt; 0){
      const t = Math.round(alloc.total);
      $(&quot;totalNum&quot;).value = t;
      $(&quot;totalSlider&quot;).value = clamp(t, 10000, 300000);

    if(typeof alloc.pctAdq === &quot;number&quot;){
      pct = { adq: alloc.pctAdq, mej: alloc.pctMej, sem: alloc.pctSem };
    }
    render();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(alloc)); } catch(e){}
    updateSavedNote();
  };

  function updateSavedNote(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){
        $(&quot;savedNote&quot;).textContent = &quot;Aún no has guardado ninguna distribución (base: $90.000 millones).&quot;;
        return;
      }
      const alloc = JSON.parse(raw);
      const d = new Date(alloc.savedAt);
      $(&quot;savedNote&quot;).innerHTML = &#x27;Última distribución guardada: &lt;b style=&quot;color:#e2e8f0&quot;&gt;&#x27; + d.toLocaleString(&quot;es-CO&quot;) + &#x27;&lt;/b&gt; — $&#x27; + fmtInt(alloc.total) + &#x27; millones (Adq. &#x27; + Math.round(alloc.pctAdq) + &#x27;% · Mej. &#x27; + Math.round(alloc.pctMej) + &#x27;% · Sem. &#x27; + Math.round(alloc.pctSem) + &#x27;%)&#x27;;
    } catch(e){}
  }

  KEYS.forEach(k =&gt; {
    const c = CAP[k];
    $(&quot;slider&quot; + c).addEventListener(&quot;input&quot;, () =&gt; rebalance(k, Number($(&quot;slider&quot; + c).value)));
    $(&quot;pctIn&quot; + c).addEventListener(&quot;input&quot;, () =&gt; rebalance(k, Number($(&quot;pctIn&quot; + c).value)));
    $(&quot;abs&quot; + c).addEventListener(&quot;input&quot;, () =&gt; {
      const total = totalM();
      const v = Math.max(0, Number($(&quot;abs&quot; + c).value) || 0);
      rebalance(k, total &gt; 0 ? (v / total) * 100 : 0);
    });
  });

  $(&quot;totalSlider&quot;).addEventListener(&quot;input&quot;, () =&gt; { $(&quot;totalNum&quot;).value = $(&quot;totalSlider&quot;).value; render(); saveAllocation(); });
  $(&quot;totalNum&quot;).addEventListener(&quot;input&quot;, () =&gt; {
    const v = Math.max(0, Number($(&quot;totalNum&quot;).value) || 0);
    $(&quot;totalSlider&quot;).value = clamp(v, 10000, 300000);
    render(); saveAllocation();
  });
  $(&quot;btnReset&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    localStorage.removeItem(STORAGE_KEY);
    locked = { adq:false, mej:false, sem:false };
    KEYS.forEach(k =&gt; { $(&quot;lock&quot; + CAP[k]).classList.remove(&quot;locked&quot;); $(&quot;lock&quot; + CAP[k]).textContent = &quot;🔓&quot;; });
    $(&quot;totalNum&quot;).value = 90000; $(&quot;totalSlider&quot;).value = 90000;
    pct = { adq: 33, mej: 34, sem: 33 };
    render(); updateSavedNote();
  });

  (function init(){
    $(&quot;totalNum&quot;).value = 90000;
    $(&quot;totalSlider&quot;).value = 90000;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const alloc = JSON.parse(raw);
        if(alloc &amp;&amp; typeof alloc.total === &quot;number&quot; &amp;&amp; alloc.total &gt; 0){
          const t = Math.round(alloc.total);
          $(&quot;totalNum&quot;).value = t;
          $(&quot;totalSlider&quot;).value = clamp(t, 10000, 300000);
        }
        if(alloc &amp;&amp; typeof alloc.pctAdq === &quot;number&quot;){
          pct = { adq: alloc.pctAdq, mej: alloc.pctMej, sem: alloc.pctSem };
        }
      }
    } catch(e){}
    drawMiniHist(&quot;adq&quot;, &quot;svgHistAdq&quot;);
    drawMiniHist(&quot;mej&quot;, &quot;svgHistMej&quot;);
    drawMiniHist(&quot;sem&quot;, &quot;svgHistSem&quot;);
    drawGlobalChart();
    render();
    updateSavedNote();
  })();
})();
&lt;/script&gt;

<script>
(function(){
  &quot;use strict&quot;;

  // SMMLV 2026 vigente (Decreto 159 de 2026) — fijo, no editable: todo el decreto opera en SMLMV.
  const SMMLV = 1750905;

  // ---------- Fonvivienda urbano — Sisbén IV (Decreto 775/2025, art. 8) ----------
  const BRACKETS_DEFAULT = [
    { label: &quot;Sisbén A1–C8&quot;, smlmv: 30, pct: 55, capMin: 0, capMax: 30 },
    { label: &quot;Sisbén C9–D20&quot;, smlmv: 20, pct: 45, capMin: 0, capMax: 20 },
  ];

  let state = { brackets: JSON.parse(JSON.stringify(BRACKETS_DEFAULT)) };

  const $ = (id) => document.getElementById(id);
  const fmtCOP = (n) => &quot;$&quot; + Math.round(n).toLocaleString(&quot;es-CO&quot;);
  const fmtInt = (n) => Math.round(n).toLocaleString(&quot;es-CO&quot;);
  const fmtCOPShort = (n) => {
    if (n >= 1e12) return &quot;$&quot; + (n/1e12).toLocaleString(&quot;es-CO&quot;,{maximumFractionDigits:2}) + &quot; billones&quot;;
    if (n >= 1e9) return &quot;$&quot; + (n/1e9).toLocaleString(&quot;es-CO&quot;,{maximumFractionDigits:2}) + &quot; mil millones&quot;;
    if (n >= 1e6) return &quot;$&quot; + (n/1e6).toLocaleString(&quot;es-CO&quot;,{maximumFractionDigits:1}) + &quot; millones&quot;;
    return fmtCOP(n);
  };

  function renderBrackets(){
    const zone = $(&quot;bracketZone&quot;);
    zone.innerHTML = &quot;&quot;;
    state.brackets.forEach((b, i) => {
      const block = document.createElement(&quot;div&quot;);
      block.className = &quot;bracket-block&quot;;
      block.innerHTML = `
        <div class=&quot;name&quot;>${b.label}</div>
        <div class=&quot;bracket-sub&quot;><span>Tope del subsidio</span><span class=&quot;v cap-v&quot;>${b.smlmv} SMLMV</span></div>
      `;
      const capSlider = document.createElement(&quot;input&quot;);
      capSlider.type = &quot;range&quot;; capSlider.min = b.capMin; capSlider.max = b.capMax; capSlider.step = 1; capSlider.value = b.smlmv;
      capSlider.addEventListener(&quot;input&quot;, (e) => {
        state.brackets[i].smlmv = Number(e.target.value);
        block.querySelector(&quot;.cap-v&quot;).textContent = state.brackets[i].smlmv + &quot; SMLMV&quot;;
        compute();
      });
      block.appendChild(capSlider);
      zone.appendChild(block);
    });
    $(&quot;mixSlider&quot;).value = state.brackets[1].pct;
    $(&quot;mixPctA&quot;).textContent = state.brackets[0].pct + &quot;%&quot;;
    $(&quot;mixPctB&quot;).textContent = state.brackets[1].pct + &quot;%&quot;;
    compute();
  }

  $(&quot;mixSlider&quot;).addEventListener(&quot;input&quot;, (e) => {
    const pctB = Number(e.target.value);
    const pctA = 100 - pctB;
    state.brackets[0].pct = pctA;
    state.brackets[1].pct = pctB;
    $(&quot;mixPctA&quot;).textContent = pctA + &quot;%&quot;;
    $(&quot;mixPctB&quot;).textContent = pctB + &quot;%&quot;;
    compute();
  });

  function weightedAvgSmlmv(){
    const sum = state.brackets.reduce((a,b)=>a+Number(b.pct),0) || 1;
    return state.brackets.reduce((acc,b)=> acc + (b.smlmv * (Number(b.pct)/sum)), 0);
  }

  function renderHBars(svg, items){
    const padL = 115, padR = 205, padT = 3, rowH = 22;
    const W = 500, innerW = W - padL - padR;
    const H = items.length * rowH + padT * 2;
    const max = Math.max(...items.map(i => i.value), 1) * 1.12;
    let html = &quot;&quot;;
    items.forEach((it, i) => {
      const y = padT + i * rowH;
      const barW = Math.max(0, (it.value / max) * innerW);
      html += `<text x=&quot;${padL-8}&quot; y=&quot;${y+rowH*0.66}&quot; text-anchor=&quot;end&quot; class=&quot;axis-label&quot; style=&quot;font-weight:600;&quot;>${it.label}</text>`;
      html += `<rect x=&quot;${padL}&quot; y=&quot;${y+4}&quot; width=&quot;${innerW}&quot; height=&quot;${rowH-8}&quot; rx=&quot;3&quot; fill=&quot;var(--grid-line)&quot;></rect>`;
      html += `<rect x=&quot;${padL}&quot; y=&quot;${y+4}&quot; width=&quot;${barW}&quot; height=&quot;${rowH-8}&quot; rx=&quot;3&quot; fill=&quot;${it.color}&quot;></rect>`;
      html += `<text x=&quot;${padL+barW+7}&quot; y=&quot;${y+rowH*0.66}&quot; class=&quot;bar-value&quot; style=&quot;text-anchor:start; fill:${it.textColor || 'var(--ink-soft)'};&quot;>${it.valueLabel}</text>`;
    });
    svg.setAttribute(&quot;viewBox&quot;, `0 0 ${W} ${H}`);
    svg.innerHTML = html;
  }

  function compute(){
    const smmlv = SMMLV;
    const presupuestoM = Math.max(0, Number($(&quot;presupuestoNum&quot;).value) || 0); // in millions COP
    const presupuesto = presupuestoM * 1e6;
    const meta = Number($(&quot;meta&quot;).value) || 1;

    const totalSmlmv = weightedAvgSmlmv();
    const avgCOP = totalSmlmv * smmlv;

    const hogares = avgCOP > 0 ? Math.floor((presupuesto / avgCOP) + 1e-9) : 0;
    const cumplimiento = (hogares / meta) * 100;
    const presupuestoMeta = meta * avgCOP;
    const brecha = presupuestoMeta - presupuesto;

    // ---- paint results ----
    $(&quot;kpiMeta&quot;).textContent = fmtInt(meta);
    $(&quot;kpiPresupuesto&quot;).textContent = fmtCOPShort(presupuesto);
    $(&quot;kpiAvgSmlmv&quot;).textContent = totalSmlmv.toFixed(1) + &quot; SMLMV&quot;;
    $(&quot;kpiHogares&quot;).textContent = `${fmtInt(hogares)} (${cumplimiento.toFixed(1)}%)`;
    $(&quot;kpiValorA&quot;).textContent = fmtCOP(state.brackets[0].smlmv * smmlv);
    $(&quot;kpiValorB&quot;).textContent = fmtCOP(state.brackets[1].smlmv * smmlv);

    const gaugePill = $(&quot;gaugePill&quot;);
    const gaugeFill = $(&quot;gaugeFill&quot;);
    const pct = Math.max(0, Math.min(100, cumplimiento));
    gaugeFill.style.width = pct + &quot;%&quot;;
    let level = cumplimiento >= 90 ? &quot;good&quot; : cumplimiento >= 50 ? &quot;warn&quot; : &quot;critical&quot;;
    gaugeFill.className = &quot;gauge-fill &quot; + level;
    gaugePill.className = &quot;pill &quot; + level;
    gaugePill.textContent = cumplimiento.toFixed(1) + &quot;% de &quot; + fmtInt(meta) + &quot; hogares meta&quot;;

    $(&quot;presupuestoVal&quot;).textContent = presupuestoM >= 1e6
      ? (presupuestoM / 1e6).toLocaleString(&quot;es-CO&quot;, {minimumFractionDigits:2, maximumFractionDigits:2}) + &quot; billones&quot;
      : fmtInt(presupuestoM) + &quot; millones&quot;;
    $(&quot;metaVal&quot;).textContent = fmtInt(meta) + &quot; hogares&quot;;

    // hogares por tramo Sisbén según la meta y el % de cada tramo
    $(&quot;kpiHogaresA&quot;).textContent = fmtInt(Math.round(meta * state.brackets[0].pct/100));
    $(&quot;kpiHogaresB&quot;).textContent = fmtInt(Math.round(meta * state.brackets[1].pct/100));

    const gapBar = Math.abs(brecha) < 1
      ? { label:&quot;Equilibrio&quot;, value:0, valueLabel:&quot;$0 (cierre exacto)&quot;, color:&quot;var(--good)&quot;, textColor:&quot;var(--good)&quot; }
      : brecha > 0
        ? { label:&quot;Brecha (faltante)&quot;, value:brecha, valueLabel:fmtCOPShort(brecha) + &quot; (para cumplir 100% meta)&quot;, color:&quot;var(--critical)&quot;, textColor:&quot;var(--critical)&quot; }
        : { label:&quot;Superávit&quot;, value:-brecha, valueLabel:fmtCOPShort(-brecha) + &quot; (excedente sobre meta)&quot;, color:&quot;var(--good)&quot;, textColor:&quot;var(--good)&quot; };

    renderHBars($(&quot;chartPresupuesto&quot;), [
      { label:&quot;Disponible&quot;, value:presupuesto, valueLabel:fmtCOPShort(presupuesto), color:&quot;var(--structure)&quot; },
      { label:&quot;Requerido (meta)&quot;, value:presupuestoMeta, valueLabel:fmtCOPShort(presupuestoMeta), color:&quot;var(--warn)&quot; },
      gapBar,
    ]);

    renderProjection();
  }

  [&quot;presupuesto&quot;,&quot;meta&quot;].forEach(id => $(id).addEventListener(&quot;input&quot;, compute));

  let lastEdited = &quot;presupuesto&quot;;

  // presupuesto: slider <-> number box
  $(&quot;presupuesto&quot;).addEventListener(&quot;input&quot;, () => { lastEdited = &quot;presupuesto&quot;; $(&quot;presupuestoNum&quot;).value = $(&quot;presupuesto&quot;).value; });
  $(&quot;presupuestoNum&quot;).addEventListener(&quot;input&quot;, () => {
    lastEdited = &quot;presupuesto&quot;;
    const v = Number($(&quot;presupuestoNum&quot;).value);
    if (isNaN(v)) return;
    const min = Number($(&quot;presupuesto&quot;).min), max = Number($(&quot;presupuesto&quot;).max);
    $(&quot;presupuesto&quot;).value = Math.max(min, Math.min(max, v));
    compute();
  });

  // meta: slider <-> number box
  $(&quot;metaSlider&quot;).addEventListener(&quot;input&quot;, () => {
    lastEdited = &quot;meta&quot;;
    $(&quot;meta&quot;).value = $(&quot;metaSlider&quot;).value;
    compute();
  });
  $(&quot;meta&quot;).addEventListener(&quot;input&quot;, () => {
    lastEdited = &quot;meta&quot;;
    const v = Number($(&quot;meta&quot;).value);
    if (isNaN(v)) return;
    const min = Number($(&quot;metaSlider&quot;).min), max = Number($(&quot;metaSlider&quot;).max);
    $(&quot;metaSlider&quot;).value = Math.max(min, Math.min(max, v));
  });

  function syncBudgetFromMeta(){
    const meta = Math.max(0, Number($(&quot;meta&quot;).value) || 0);
    const avgCOP = weightedAvgSmlmv() * SMMLV;
    const reqM = Number((Math.ceil(meta * avgCOP) / 1e6).toFixed(6));
    $(&quot;presupuestoNum&quot;).value = reqM;
    const min = Number($(&quot;presupuesto&quot;).min), max = Number($(&quot;presupuesto&quot;).max);
    $(&quot;presupuesto&quot;).value = Math.max(min, Math.min(max, reqM));
    compute();
  }

  function syncMetaFromBudget(){
    const presupuesto = Math.max(0, Number($(&quot;presupuestoNum&quot;).value) || 0) * 1e6;
    const avgCOP = weightedAvgSmlmv() * SMMLV;
    const hogares = avgCOP > 0 ? Math.floor(presupuesto / avgCOP) : 0;
    $(&quot;meta&quot;).value = hogares;
    const min = Number($(&quot;metaSlider&quot;).min), max = Number($(&quot;metaSlider&quot;).max);
    $(&quot;metaSlider&quot;).value = Math.max(min, Math.min(max, hogares));
    compute();
  }

  function saveCurrentScenario(){
    savedScenarios.push(captureCurrentScenario());
    renderScenarios();
  }

  $(&quot;meta&quot;).addEventListener(&quot;keydown&quot;, (e) => {
    if (e.key !== &quot;Enter&quot;) return;
    e.preventDefault();
    syncBudgetFromMeta();
    saveCurrentScenario();
  });

  $(&quot;presupuestoNum&quot;).addEventListener(&quot;keydown&quot;, (e) => {
    if (e.key !== &quot;Enter&quot;) return;
    e.preventDefault();
    syncMetaFromBudget();
    saveCurrentScenario();
  });

  function optimizeKeepingSisben(){
    const presupuesto = Math.max(0, Number($(&quot;presupuestoNum&quot;).value) || 0) * 1e6;
    const avgCOP = weightedAvgSmlmv() * SMMLV;
    const hogares = avgCOP > 0 ? Math.floor(presupuesto / avgCOP) : 0;
    $(&quot;meta&quot;).value = hogares;
    const mMin = Number($(&quot;metaSlider&quot;).min), mMax = Number($(&quot;metaSlider&quot;).max);
    $(&quot;metaSlider&quot;).value = Math.max(mMin, Math.min(mMax, hogares));
    // redondea al peso hacia arriba para que nunca falte ni un peso
    const reqM = Number((Math.ceil(hogares * avgCOP) / 1e6).toFixed(6));
    if (reqM !== Number($(&quot;presupuestoNum&quot;).value)){
      $(&quot;presupuestoNum&quot;).value = reqM;
      const pMin = Number($(&quot;presupuesto&quot;).min), pMax = Number($(&quot;presupuesto&quot;).max);
      $(&quot;presupuesto&quot;).value = Math.max(pMin, Math.min(pMax, reqM));
    }
    compute();
  }

  $(&quot;btnApplyScenario&quot;).addEventListener(&quot;click&quot;, () => {
    const mode = document.querySelector('input[name=&quot;optTarget&quot;]:checked')?.value || &quot;meta&quot;;
    if (mode === &quot;meta&quot;) syncBudgetFromMeta();
    else if (mode === &quot;presupuesto&quot;) syncMetaFromBudget();
    else optimizeKeepingSisben();
    saveCurrentScenario();
  });

  $(&quot;btnSaveRaw&quot;).addEventListener(&quot;click&quot;, saveCurrentScenario);

  // ---------- historical chart (full program, all mechanisms) ----------
  const HIST = [
    { year:2020, asignados:38713, meta:30540, copB:0.92 },
    { year:2021, asignados:67542, meta:30000, copB:1.66 },
    { year:2022, asignados:67338, meta:30000, copB:1.72 },
    { year:2023, asignados:52239, meta:29333, copB:1.58 },
    { year:2024, asignados:50218, meta:29333, copB:1.67 },
    { year:2025, asignados:8672,  meta:29333, copB:0.34 },
    { year:2026, asignados:250,   meta:29333, copB:0.01, frozen:true },
  ];

  function drawChart(){
    const svg = $(&quot;chartSvg&quot;);
    const W = 580, H = 178, padL = 44, padB = 18, padT = 18, padR = 46;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const maxVal = Math.max(...HIST.map(d=>Math.max(d.asignados,d.meta))) * 1.16;
    const maxB = 2.0;
    const bw = innerW / HIST.length;
    const scaleY = v => innerH - (v/maxVal)*innerH;
    const scaleB = v => innerH - (v/maxB)*innerH;

    let svgHTML = &quot;&quot;;
    const y0 = padT + innerH;
    svgHTML += `<line x1=&quot;${padL}&quot; y1=&quot;${y0}&quot; x2=&quot;${W-padR}&quot; y2=&quot;${y0}&quot; stroke=&quot;var(--grid-line)&quot; stroke-width=&quot;1&quot;/>`;
    svgHTML += `<text x=&quot;${padL-5}&quot; y=&quot;${padT+7}&quot; text-anchor=&quot;end&quot; fill=&quot;#658195&quot; font-size=&quot;8.5&quot; font-family=&quot;Cascadia Mono, monospace&quot;>75k</text>`;
    svgHTML += `<text x=&quot;${padL-5}&quot; y=&quot;${y0}&quot; text-anchor=&quot;end&quot; fill=&quot;#658195&quot; font-size=&quot;8.5&quot; font-family=&quot;Cascadia Mono, monospace&quot;>0</text>`;
    svgHTML += `<text x=&quot;${W-padR+5}&quot; y=&quot;${padT+7}&quot; text-anchor=&quot;start&quot; fill=&quot;#e879f9&quot; font-size=&quot;8.5&quot; font-family=&quot;Cascadia Mono, monospace&quot;>$2B</text>`;
    svgHTML += `<text x=&quot;${W-padR+5}&quot; y=&quot;${y0}&quot; text-anchor=&quot;start&quot; fill=&quot;#658195&quot; font-size=&quot;8.5&quot; font-family=&quot;Cascadia Mono, monospace&quot;>$0</text>`;
    const midY = padT + innerH/2;
    svgHTML += `<text x=&quot;11&quot; y=&quot;${midY}&quot; text-anchor=&quot;middle&quot; fill=&quot;#9ab4c5&quot; font-size=&quot;8.5&quot; font-weight=&quot;700&quot; transform=&quot;rotate(-90 11 ${midY})&quot;>Subsidios</text>`;
    svgHTML += `<text x=&quot;${W-10}&quot; y=&quot;${midY}&quot; text-anchor=&quot;middle&quot; fill=&quot;#e879f9&quot; font-size=&quot;8.5&quot; font-weight=&quot;700&quot; transform=&quot;rotate(90 ${W-10} ${midY})&quot;>Inversión ($B)</text>`;

    HIST.forEach((d,i) => {
      const x = padL + i*bw + bw*0.3;
      const bwReal = bw*0.4;
      const y = padT + scaleY(d.asignados);
      const h = innerH - scaleY(d.asignados);
      svgHTML += `<rect class=&quot;bar${d.frozen?' frozen':''}&quot; data-i=&quot;${i}&quot; x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${bwReal}&quot; height=&quot;${Math.max(h,1)}&quot; rx=&quot;2&quot;></rect>`;
      svgHTML += `<text class=&quot;bar-value&quot; x=&quot;${x+bwReal/2}&quot; y=&quot;${y-5}&quot;>${fmtInt(d.asignados)}</text>`;
      svgHTML += `<text class=&quot;axis-label&quot; x=&quot;${x+bwReal/2}&quot; y=&quot;${H-padB+12}&quot; text-anchor=&quot;middle&quot;>${d.year}</text>`;
    });
    let points = HIST.map((d,i) => {
      const x = padL + i*bw + bw*0.5;
      const y = padT + scaleY(d.meta);
      return x+&quot;,&quot;+y;
    }).join(&quot; &quot;);
    svgHTML += `<polyline class=&quot;meta-line&quot; points=&quot;${points}&quot; fill=&quot;none&quot;/>`;
    let copPts = HIST.map((d,i) => (padL + i*bw + bw*0.5) + &quot;,&quot; + (padT + scaleB(d.copB))).join(&quot; &quot;);
    svgHTML += `<polyline points=&quot;${copPts}&quot; fill=&quot;none&quot; stroke=&quot;#e879f9&quot; stroke-width=&quot;2&quot;/>`;
    HIST.forEach((d,i) => {
      const cx = padL + i*bw + bw*0.5, cy = padT + scaleB(d.copB);
      const yBar = padT + scaleY(d.asignados);
      const copLbl = &quot;$&quot; + d.copB.toFixed(2).replace(&quot;.&quot;, &quot;,&quot;) + &quot;B&quot;;
      const lblY = (cy >= yBar - 4 && (innerH - scaleY(d.asignados)) > 28) ? Math.min(cy + 13, y0 - 5) : Math.min(cy - 7, yBar - 17);
      svgHTML += `<circle cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;2.8&quot; fill=&quot;#e879f9&quot; stroke=&quot;#101a23&quot; stroke-width=&quot;1&quot;/>`;
      svgHTML += `<text x=&quot;${cx}&quot; y=&quot;${lblY}&quot; text-anchor=&quot;middle&quot; fill=&quot;#f5d0fe&quot; font-size=&quot;8&quot; font-weight=&quot;700&quot; font-family=&quot;Cascadia Mono, monospace&quot; style=&quot;paint-order:stroke;stroke:#0d161f;stroke-width:3px;stroke-linejoin:round;&quot;>${copLbl}</text>`;
    });
    const lastMeta = HIST[HIST.length-1];
    const lastX = padL + (HIST.length-1)*bw + bw*0.5;
    const lastY = padT + scaleY(lastMeta.meta);
    svgHTML += `<text class=&quot;meta-tag&quot; x=&quot;${lastX+8}&quot; y=&quot;${lastY+3}&quot;>Meta</text>`;

    svg.setAttribute(&quot;viewBox&quot;, `0 0 ${W} ${H}`);
    svg.innerHTML = svgHTML;

    const tooltip = $(&quot;chartTooltip&quot;);
    svg.querySelectorAll(&quot;.bar&quot;).forEach(rect => {
      rect.addEventListener(&quot;mousemove&quot;, (e) => {
        const d = HIST[Number(rect.dataset.i)];
        const cumplPct = (d.asignados/d.meta*100).toFixed(0);
        tooltip.innerHTML = `<b>${d.year}</b>${d.frozen?' (congelado, parcial)':''}<br>Asignados: ${fmtInt(d.asignados)}<br>Inversión: $${d.copB.toFixed(2).replace('.',',')} B<br>Meta CONPES: ${fmtInt(d.meta)} (${cumplPct}%)`;
        tooltip.style.opacity = 1;
        const wrapBounds = svg.parentElement.getBoundingClientRect();
        tooltip.style.left = (e.clientX - wrapBounds.left + 14) + &quot;px&quot;;
        tooltip.style.top = (e.clientY - wrapBounds.top - 36) + &quot;px&quot;;
      });
      rect.addEventListener(&quot;mouseleave&quot;, () => tooltip.style.opacity = 0);
    });
  }

  // ---------- projection (Fonvivienda urbano only) ----------
  function renderProjection(){
    const years = 4;
    const growth = Number($(&quot;projGrowth&quot;).value)/100;
    const deficit = Number($(&quot;projDeficit&quot;).value) || 1;
    const startYear = 2027;
    $(&quot;projGrowthVal&quot;).textContent = (growth*100).toFixed(0) + &quot;%&quot;;
    $(&quot;projDeficitVal&quot;).textContent = fmtInt(deficit) + &quot; hogares&quot;;

    const smmlv = SMMLV;
    const baseBudget = Math.max(0, Number($(&quot;presupuestoNum&quot;).value) || 0) * 1e6;
    const avgSmlmv = weightedAvgSmlmv();
    const avgCOP = avgSmlmv * smmlv;

    const tbody = document.querySelector(&quot;#projTable tbody&quot;);
    tbody.innerHTML = &quot;&quot;;
    let acumulado = 0;
    let budget = baseBudget;
    for (let i=0;i<years;i++){
      const hogares = avgCOP > 0 ? Math.floor(budget/avgCOP) : 0;
      acumulado += hogares;
      const pctDeficit = (acumulado/deficit)*100;
      const tr = document.createElement(&quot;tr&quot;);
      tr.innerHTML = `<td>${startYear+i}</td><td>${fmtCOPShort(budget)}</td><td>${fmtCOP(avgCOP)}</td><td>${fmtInt(hogares)}</td><td>${fmtInt(acumulado)}</td><td>${pctDeficit.toFixed(2)}%</td>`;
      tbody.appendChild(tr);
      budget = budget * (1+growth);
    }
    const trTotal = document.createElement(&quot;tr&quot;);
    trTotal.innerHTML = `<td>Total ${startYear}–${startYear+years-1}</td><td>—</td><td>—</td><td>${fmtInt(acumulado)}</td><td>—</td><td>${((acumulado/deficit)*100).toFixed(2)}%</td>`;
    tbody.appendChild(trTotal);
  }

  [&quot;projGrowth&quot;,&quot;projDeficit&quot;].forEach(id => $(id).addEventListener(&quot;input&quot;, renderProjection));

  // ---------- scenario comparison ----------
  let savedScenarios = [];
  let scenarioSeq = 1;

  function captureCurrentScenario(){
    const presupuestoM = Math.max(0, Number($(&quot;presupuestoNum&quot;).value) || 0);
    const presupuesto = presupuestoM * 1e6;
    const meta = Number($(&quot;meta&quot;).value) || 1;
    const avgSmlmv = weightedAvgSmlmv();
    const avgCOP = avgSmlmv * SMMLV;
    const hogares = avgCOP > 0 ? Math.floor(presupuesto / avgCOP) : 0;
    const cumplimiento = (hogares / meta) * 100;
    const brecha = meta * avgCOP - presupuesto;
    const growth = Number($(&quot;projGrowth&quot;).value) / 100;
    const deficit = Number($(&quot;projDeficit&quot;).value) || 1;

    let acum = 0;
    let b = presupuesto;
    for (let i = 0; i < 4; i++){
      acum += avgCOP > 0 ? Math.floor(b / avgCOP) : 0;
      b *= (1 + growth);
    }

    return {
      id: scenarioSeq++,
      presupuestoM,
      presupuesto,
      meta,
      brackets: JSON.parse(JSON.stringify(state.brackets)),
      avgSmlmv,
      hogares,
      cumplimiento,
      brecha,
      growthPct: Number($(&quot;projGrowth&quot;).value),
      deficit,
      acumulado: acum,
      pctDeficit: (acum / deficit) * 100
    };
  }

  function renderScenarios(){
    const empty = $(&quot;scenariosEmpty&quot;);
    const table = $(&quot;scenariosTable&quot;);
    const tbody = table.querySelector(&quot;tbody&quot;);
    tbody.innerHTML = &quot;&quot;;

    if (savedScenarios.length === 0){
      empty.style.display = &quot;block&quot;;
      table.style.display = &quot;none&quot;;
      return;
    }

    empty.style.display = &quot;none&quot;;
    table.style.display = &quot;table&quot;;

    savedScenarios.forEach((s, idx) => {
      const tr = document.createElement(&quot;tr&quot;);
      const gapText = Math.abs(s.brecha) < 1 ? &quot;$0&quot; : (s.brecha > 0 ? &quot;-&quot; + fmtCOPShort(s.brecha) : &quot;+&quot; + fmtCOPShort(-s.brecha));
      const gapClass = s.brecha > 1 ? &quot;bad&quot; : &quot;ok&quot;;
      const sisbenText = `${s.brackets[0].smlmv}S·${s.brackets[0].pct}% / ${s.brackets[1].smlmv}S·${s.brackets[1].pct}%`;
      tr.innerHTML = `
        <td><b>Esc. ${s.id}</b></td>
        <td>${fmtCOPShort(s.presupuesto)}</td>
        <td>${fmtInt(s.meta)}</td>
        <td>${sisbenText}</td>
        <td>${s.avgSmlmv.toFixed(1)} SMLMV</td>
        <td>${fmtInt(s.hogares)} (${s.cumplimiento.toFixed(1)}%)</td>
        <td class=&quot;${gapClass}&quot;>${gapText}</td>
        <td>${fmtInt(s.acumulado)} (${s.pctDeficit.toFixed(2)}%)</td>
        <td>
          <span class=&quot;row-actions&quot;>
            <button type=&quot;button&quot; class=&quot;icon-btn load-sc&quot; data-idx=&quot;${idx}&quot; title=&quot;Cargar este escenario en el simulador&quot;>Cargar</button>
            <button type=&quot;button&quot; class=&quot;icon-btn del del-sc&quot; data-idx=&quot;${idx}&quot; title=&quot;Eliminar escenario&quot;>×</button>
          </span>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll(&quot;.load-sc&quot;).forEach(btn => {
      btn.addEventListener(&quot;click&quot;, () => {
        const s = savedScenarios[Number(btn.dataset.idx)];
        if (!s) return;
        state.brackets = JSON.parse(JSON.stringify(s.brackets));
        $(&quot;presupuestoNum&quot;).value = s.presupuestoM;
        const pMin = Number($(&quot;presupuesto&quot;).min), pMax = Number($(&quot;presupuesto&quot;).max);
        $(&quot;presupuesto&quot;).value = Math.max(pMin, Math.min(pMax, s.presupuestoM));
        $(&quot;meta&quot;).value = s.meta;
        const mMin = Number($(&quot;metaSlider&quot;).min), mMax = Number($(&quot;metaSlider&quot;).max);
        $(&quot;metaSlider&quot;).value = Math.max(mMin, Math.min(mMax, s.meta));
        $(&quot;projGrowth&quot;).value = s.growthPct;
        $(&quot;projDeficit&quot;).value = s.deficit;
        renderBrackets();
      });
    });

    tbody.querySelectorAll(&quot;.del-sc&quot;).forEach(btn => {
      btn.addEventListener(&quot;click&quot;, () => {
        savedScenarios.splice(Number(btn.dataset.idx), 1);
        renderScenarios();
      });
    });
  }

  $(&quot;btnClearScenarios&quot;).addEventListener(&quot;click&quot;, () => {
    savedScenarios = [];
    renderScenarios();
  });

  // ---------- presupuesto asignado desde la portada (si existe) ----------
  (function loadPortadaAllocation(){
    try{
      const raw = localStorage.getItem(&quot;mvct_housing_budget_allocation&quot;);
      if (!raw) return;
      const alloc = JSON.parse(raw);
      if (alloc &amp;&amp; typeof alloc.mAdq === &quot;number&quot; &amp;&amp; alloc.mAdq > 0){
        $(&quot;presupuestoNum&quot;).value = alloc.mAdq;
        const min = Number($(&quot;presupuesto&quot;).min), max = Number($(&quot;presupuesto&quot;).max);
        $(&quot;presupuesto&quot;).value = Math.max(min, Math.min(max, alloc.mAdq));
      }
    } catch(e){}
  })();

  window.mvctApplyAlloc = function(alloc){
    if (!alloc || typeof alloc.mAdq !== &quot;number&quot; || alloc.mAdq <= 0) return;
    $(&quot;presupuestoNum&quot;).value = Math.round(alloc.mAdq);
    const min = Number($(&quot;presupuesto&quot;).min), max = Number($(&quot;presupuesto&quot;).max);
    $(&quot;presupuesto&quot;).value = Math.max(min, Math.min(max, Math.round(alloc.mAdq)));
    compute();
  };

  window.enviarAPortada = function(){
    try{
      const prev = (window.parent &amp;&amp; window.parent.mvctAlloc) || JSON.parse(localStorage.getItem(&quot;mvct_housing_budget_allocation&quot;) || &quot;null&quot;) || { total:90000, mAdq:29700, mMej:30600, mSem:29700 };
      const mAdq = Math.max(0, Math.round(Number($(&quot;presupuestoNum&quot;).value) || 0));
      const mMej = Math.max(0, Math.round(Number(prev.mMej) || 30600));
      const mSem = Math.max(0, Math.round(Number(prev.mSem) || 29700));
      const total = Math.max(1, mAdq + mMej + mSem);
      const pAdq = (mAdq / total) * 100, pMej = (mMej / total) * 100, pSem = (mSem / total) * 100;
      const alloc = {
        total, pctAdq: pAdq, pctMej: pMej, pctSem: pSem,
        mAdq, mMej, mSem, savedAt: new Date().toISOString()
      };
      try{ localStorage.setItem(&quot;mvct_housing_budget_allocation&quot;, JSON.stringify(alloc)); } catch(e){}
      if(window.parent &amp;&amp; window.parent.mvctSetAlloc){ window.parent.mvctSetAlloc(alloc); }
    } catch(e){}
    if(window.parent &amp;&amp; window.parent.mvctShowView){ window.parent.mvctShowView(&quot;portada&quot;, false); }
  };

  // ---------- init ----------
  renderBrackets();
  drawChart();
  renderProjection();
  renderScenarios();
})();
</script>

    --structure-dim:#9333ea;
    --structure-soft:rgba(192, 132, 252, 0.14);
    --brand-gold:#fbbf24;
    --good:#34d399;
    --good-soft:rgba(52, 211, 153, 0.14);
    --warn:#fbbf24;
    --warn-soft:rgba(251, 191, 36, 0.14);
    --critical:#f87171;
    --critical-soft:rgba(248, 113, 113, 0.14);
    --grid-line:#1d303f;
    --status-good:var(--good);
    --text-primary:var(--ink);
    --text-secondary:var(--ink-soft);
    --text-muted:var(--ink-faint);
    --gridline:var(--border);
    --card-bg:var(--surface-2);
    --shadow: 8px 8px 18px rgba(5, 8, 14, .78), -5px -5px 14px rgba(42, 60, 84, .28), inset 0 1px 1px rgba(190, 225, 250, .12);
    --shadow-sm: 5px 5px 11px rgba(5, 8, 14, .72), -3px -3px 8px rgba(42, 60, 84, .26), inset 0 1px 1px rgba(190, 225, 250, .14);
    --shadow-inset: inset 4px 4px 10px rgba(5, 8, 14, .82), inset -3px -3px 8px rgba(40, 56, 78, .22);
    --radius:11px;
    --font-ui: &quot;Segoe UI&quot;, Inter, system-ui, -apple-system, Roboto, Arial, sans-serif;
    --font-mono: &quot;Cascadia Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, ui-monospace, monospace;
  }

  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0; background:var(--bg-glow); background-color:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:13px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%; min-height:100vh; margin:0;
    padding:8px clamp(12px, 1.5vw, 24px) 10px;
    display:flex; flex-direction:column; gap:7px;
  }
  @media (max-width:700px){ .wrap{padding:12px 14px 16px;} }

  /* ---------- header (igual a Adquisición y Semillero) ---------- */
  header.top{
    border-bottom:1px solid var(--border-strong);
    padding-bottom:6px; flex-shrink:0;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 16px;
  }
  .header-main{display:flex; flex-direction:column; gap:1px;}
  .eyebrow{
    font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--structure);
    font-weight:700; margin:0;
  }
  h1{font-size:20px; line-height:1.2; margin:0; letter-spacing:-.01em; font-weight:700; color:var(--ink);}
  .app-nav{display:flex; gap:6px; flex-wrap:wrap; align-items:center; flex-shrink:0; align-self:center;}
  .app-nav a, .app-nav span.current{
    font-size:10.5px; font-weight:600; text-decoration:none; white-space:nowrap;
    border:1px solid var(--border); border-radius:999px; padding:4px 10px;
    background:var(--surface-2); color:var(--ink-soft); transition:color .15s, border-color .15s;
  }
  .app-nav a:hover{color:var(--structure); border-color:var(--border-strong);}
  .app-nav span.current{color:var(--structure); border-color:var(--border-strong); background:var(--structure-soft); font-weight:700;}

  /* ---------- paneles neumórficos ---------- */
  .panel{
    background:linear-gradient(155deg, var(--surface-top) 0%, var(--surface) 100%);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 13px; box-shadow:var(--shadow);
  }
  .panel-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border);
  }
  .panel-head h3{
    margin:0; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--structure); font-weight:700;
  }
  .panel-head .hint{font-size:11px; color:var(--ink-faint);}

  /* ---------- banda superior A: Marco normativo (50% izq) + KPIs A-E y +1% (50% der) ---------- */
  .top-split-50{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:stretch;
  }
  @media (max-width:1100px){ .top-split-50{grid-template-columns:1fr;} }
  #esquema, #kpis-cats-top{flex-shrink:0; display:flex; flex-direction:column; justify-content:space-between;}
  .sim-marco-row{
    display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:5px;
  }
  @media (max-width:1200px){ .sim-marco-row{grid-template-columns:repeat(4, minmax(0, 1fr));} }
  @media (max-width:720px){ .sim-marco-row{grid-template-columns:repeat(2, minmax(0, 1fr));} }
  .sim-marco-row > div{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:5px 6px; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:1px; min-width:0;
  }
  .sim-ml{font-size:9px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sim-mv{font-family:var(--font-mono); font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.15; font-variant-numeric:tabular-nums;}
  .sim-ms{font-size:9px; color:var(--ink-soft); line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- 2 columnas independientes con sticky independiente (cero hueco bajo KPIs) ---------- */
  .main-2col{
    display:grid;
    grid-template-columns:clamp(500px, 43vw, 650px) 1fr;
    gap:10px 14px; align-items:stretch;
  }
  @media (max-width:1080px){ .main-2col{grid-template-columns:1fr;} }
  .col-left, .col-right{
    display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  .sticky-left{
    position:sticky; top:0; z-index:40;
    background:var(--bg);
    padding-top:4px; margin-top:-4px;
    box-shadow:0 10px 18px rgba(8, 2, 5, .75);
    border-radius:var(--radius);
  }
  .sticky-kpis{
    position:sticky; top:0; z-index:40;
    background:var(--bg);
    padding-top:4px; padding-bottom:6px; margin-top:-4px;
    box-shadow:0 10px 18px rgba(8, 2, 5, .75);
    display:flex; flex-direction:column; gap:8px; min-width:0;
  }
  .col-left > .panel:last-child,
  .col-right > .panel:last-child{
    flex:1; display:flex; flex-direction:column;
  }
  @media (max-width:1080px){
    .sticky-left, .sticky-kpis{position:static; box-shadow:none;}
  }

  /* ---------- KPIs dinámicos arriba a la derecha (2 filas compactas) ---------- */
  .kpi-group.dynamic{
    display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:7px;
  }
  .kpi-group.dynamic.cats{
    grid-template-columns:repeat(6, minmax(0, 1fr));
  }
  @media (max-width:1280px){
    .kpi-group.dynamic{grid-template-columns:repeat(3, minmax(0, 1fr));}
    .kpi-group.dynamic.cats{grid-template-columns:repeat(3, minmax(0, 1fr));}
  }
  @media (max-width:680px){
    .kpi-group.dynamic, .kpi-group.dynamic.cats{grid-template-columns:repeat(2, minmax(0, 1fr));}
  }
  .kpi{
    background:linear-gradient(155deg, var(--surface-top) 0%, var(--surface) 100%);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:6px 9px; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:1px; min-width:0;
  }
  .kpi .k{
    font-family:var(--font-mono); font-size:14px; font-weight:700; line-height:1.15;
    font-variant-numeric:tabular-nums; color:var(--ink);
  }
  .kpi .d{font-size:10px; color:var(--ink-soft); line-height:1.2;}
  .kpi.kpi-wine .k{color:var(--structure);}
  .kpi.kpi-amber .k{color:var(--warn);}
  .kpi.kpi-good .k{color:var(--good);}
  .kpi.kpi-critical .k{color:var(--critical);}
  .kpi.kpi-white .k{color:#f8fafc;}
  .result-block{margin-top:6px; padding-top:6px; border-top:1px solid var(--border);}
  .result-block-title{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; margin-bottom:4px;}
  .mini-chart{width:100%; height:auto; display:block;}
  .axis-label{font-size:10.5px; fill:var(--ink-soft); font-family:var(--font-ui);}
  .bar-value{font-size:10.5px; font-family:var(--font-mono); font-weight:700;}
  .full-span{grid-column:1 / -1;}

  /* ---------- controles compactos (Presupuesto y Meta lado a lado) ---------- */
  .sim-gc-row{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  @media (max-width:560px){ .sim-gc-row{grid-template-columns:1fr;} }
  .sim-gc-item{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:5px 9px; box-shadow:var(--shadow-inset);
    display:flex; flex-direction:column; gap:4px;
  }
  .sim-gc-label{font-size:11px; font-weight:600; color:var(--ink); white-space:nowrap;}
  .sim-gc-ctrl{display:grid; grid-template-columns:1fr 78px auto; gap:6px; align-items:center;}
  .sim-gc-ctrl input[type=&quot;number&quot;],
  .sim-ct input[type=&quot;number&quot;]{
    font-family:var(--font-mono); font-size:12px; font-weight:700;
    color:var(--ink); background:var(--surface); border:1px solid var(--border-strong);
    border-radius:6px; padding:3px 7px; text-align:right; width:100%;
    box-shadow:var(--shadow-inset); font-variant-numeric:tabular-nums;
  }
  .sim-gc-ctrl input[type=&quot;number&quot;]:focus,
  .sim-ct input[type=&quot;number&quot;]:focus{ outline:none; border-color:var(--structure); }
  .sim-gu{font-size:11px; color:var(--ink-faint); white-space:nowrap;}

  .ungrd-ref-bar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;
    margin-top:6px; padding:4px 9px; border-radius:7px;
    background:var(--surface-2); border:1px solid var(--border);
    font-size:11px; color:var(--ink-soft);
  }
  .ungrd-ref-bar b{color:var(--ink); font-family:var(--font-mono);}

  input[type=&quot;range&quot;]{
    -webkit-appearance:none; appearance:none; width:100%; height:6px;
    background:var(--surface); border-radius:999px; border:1px solid var(--border);
    box-shadow:var(--shadow-inset); outline:none; cursor:pointer;
  }
  input[type=&quot;range&quot;]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #f0d7bd 0%, var(--structure) 65%, var(--structure-dim) 100%);
    border:1.5px solid #f5ebe0; box-shadow:0 0 6px rgba(212, 163, 115, .40), 2px 2px 5px rgba(0,0,0,.65);
    cursor:pointer; transition:transform .12s;
  }
  input[type=&quot;range&quot;]::-webkit-slider-thumb:hover{transform:scale(1.12);}
  input[type=&quot;range&quot;]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; border:1.5px solid #f5ebe0;
    background:var(--structure); box-shadow:0 0 6px rgba(212, 163, 115, .40); cursor:pointer;
  }

  .btn{
    appearance:none; cursor:pointer; font-family:var(--font-ui); font-size:11.5px; font-weight:600;
    padding:5px 11px; border-radius:8px; border:1px solid var(--border-strong);
    background:linear-gradient(155deg, var(--surface-top), var(--surface-2));
    color:var(--ink); box-shadow:var(--shadow-sm); transition:transform .1s, border-color .15s, color .15s;
  }
  .btn:hover{border-color:var(--structure); color:#fff;}
  .btn:active{transform:translateY(1px); box-shadow:var(--shadow-inset);}
  .btn.primary{
    background:linear-gradient(155deg, #b88454, #8c5e35);
    border-color:rgba(240, 215, 189, .38); color:#fff; font-weight:700;
  }
  .btn.primary:hover{background:linear-gradient(155deg, #c99462, #9c6b3f);}

  /* ---------- Optimizador (radios fijos + barra de cumplimiento como Adquisición/Semillero) ---------- */
  .opt-bar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    margin-top:7px; padding-top:7px; border-top:1px solid var(--border);
  }
  .opt-radios{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .opt-lbl{font-size:11px; font-weight:700; color:var(--ink-soft);}
  .opt-check{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    color:var(--ink); cursor:pointer; padding:3px 9px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border);
  }
  .opt-check input{accent-color:var(--structure); margin:0; cursor:pointer;}
  .opt-btns{display:flex; gap:7px; align-items:center; flex-wrap:wrap;}

  .gauge-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px;
  }
  .gauge-title{font-size:11px; font-weight:700; color:var(--ink);}
  .pill{
    font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
  }
  .pill.good{background:var(--good-soft); color:var(--good);}
  .pill.warn{background:var(--warn-soft); color:var(--warn);}
  .pill.critical{background:var(--critical-soft); color:var(--critical);}
  .gauge-track{
    height:7px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border);
    box-shadow:var(--shadow-inset); overflow:hidden; margin-top:4px;
  }
  .gauge-fill{height:100%; border-radius:999px; transition:width .2s;}
  .gauge-fill.good{background:var(--good);}
  .gauge-fill.warn{background:var(--warn);}
  .gauge-fill.critical{background:var(--critical);}
  .brecha-line{
    margin-top:5px; font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;
  }
  .brecha-line b{font-family:var(--font-mono);}

  /* ---------- tabla compacta de categorías A–E ---------- */
  .cat-subhead{
    display:flex; justify-content:space-between; align-items:baseline; margin-top:9px; padding-top:7px;
    border-top:1px solid var(--border); margin-bottom:4px;
  }
  .cat-subhead span:first-child{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--structure);}
  .cat-subhead span:last-child{font-size:10.5px; color:var(--ink-faint);}
  .sim-ct-wrap{overflow-x:auto;}
  .sim-ct{width:100%; border-collapse:collapse; font-size:11.5px;}
  .sim-ct th{
    text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); font-weight:700; padding:3px 5px; border-bottom:1px solid var(--border-strong);
  }
  .sim-ct td{padding:3.5px 5px; border-bottom:1px solid var(--border); vertical-align:middle;}
  .sim-cat-name{font-weight:700; color:var(--ink); font-size:11.5px; line-height:1.15;}
  .sim-cat-tope{font-size:9.5px; color:var(--ink-faint);}
  .sim-ct .sim-cc{
    display:grid; grid-template-columns:minmax(72px, 1fr) 48px 40px; align-items:center; gap:5px;
  }
  .sim-ct .sim-cc input[type=&quot;range&quot;]{width:100%;}
  .sim-ct .sim-cc input[type=&quot;number&quot;]{width:48px; padding:2px 4px; font-size:11.5px;}
  .sim-ct .sim-cc .sim-cu{font-size:10px; color:var(--ink-faint); white-space:nowrap;}
  .sim-lock-btn{
    appearance:none; cursor:pointer; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-faint); border-radius:6px; padding:2px 5px; font-size:10.5px; line-height:1.2;
    box-shadow:var(--shadow-sm); transition:all .15s;
  }
  .sim-lock-btn:hover{border-color:var(--border-strong); color:var(--ink);}
  .sim-lock-btn.locked{
    background:var(--warn-soft); border-color:rgba(251,191,36,.45); color:var(--warn); font-weight:700;
  }
  .sim-ae-foot{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:5px;
  }
  .sim-ae-sum-bar{
    padding:3px 9px; border-radius:7px; font-size:11px; font-weight:600;
    background:var(--surface-2); border:1px solid var(--border); box-shadow:var(--shadow-inset);
    display:inline-flex; align-items:center; gap:5px; color:var(--ink-soft);
  }
  .sim-ae-sum-bar.sim-ok{border-color:rgba(52,211,153,.35); color:var(--good);}
  .sim-sv{font-family:var(--font-mono); font-weight:700;}
  .sim-ae-alert{
    display:none; padding:3px 9px; border-radius:7px; font-size:11px; font-weight:600;
    background:var(--critical-soft); border:1px solid rgba(248,113,113,.4); color:var(--critical);
  }
  .sim-ae-alert.sim-vis{display:inline-block;}

  .sim-badge{
    display:inline-flex; align-items:center; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; padding:2px 8px; border-radius:999px;
    background:var(--structure-soft); color:var(--structure); border:1px solid var(--border-strong);
  }
  .sim-badge.sim-res{background:var(--good-soft); color:var(--good); border-color:rgba(52,211,153,.35);}

  /* ---------- C · Simulador en tiempo real (#rt-wrap, abajo izquierda) ---------- */
  #rt-wrap{margin-top:2px;}
  #rt-wrap .sim-sc-body{display:grid; grid-template-columns:1.15fr 1fr; gap:12px; align-items:center;}
  @media (max-width:760px){ #rt-wrap .sim-sc-body{grid-template-columns:1fr;} }
  #rt-wrap .sim-sc-result{border-top:none !important; border-left:1px solid var(--border); padding:4px 0 4px 12px !important;}
  @media (max-width:760px){ #rt-wrap .sim-sc-result{border-left:none; border-top:1px solid var(--border) !important; padding:10px 0 0 !important;} }
  .sim-kl{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .sim-kv{font-family:var(--font-mono); font-size:15px; font-weight:700; color:var(--structure); font-variant-numeric:tabular-nums; line-height:1.2;}
  .sim-ks{font-size:10.5px; color:var(--ink-soft);}
  .sim-pr{
    display:flex; justify-content:space-between; align-items:center; gap:6px;
    padding:3.5px 5px; border-bottom:1px solid var(--border); font-size:11.5px; color:var(--ink-soft);
  }
  .sim-pr > span{min-width:0; line-height:1.15;}
  .sim-pr b{font-family:var(--font-mono); color:var(--ink); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .sim-sc-row-4 .sim-pr{padding:3px 3px; gap:4px; font-size:10.5px;}
  .sim-sc-row-4 .sim-pr > span{font-size:9.5px;}
  .sim-pr.sim-total-row{
    font-weight:700; background:var(--surface); border-radius:7px; border-bottom:none; margin-top:4px; color:var(--ink);
  }
  .sim-rl{color:var(--ink-soft); font-size:11px; margin-top:3px;}
  .sim-rh{font-family:var(--font-mono); font-size:26px; font-weight:800; color:var(--structure); font-variant-numeric:tabular-nums; line-height:1.05;}
  .sim-rc{font-family:var(--font-mono); font-size:12px; font-weight:700; margin-top:5px; color:var(--ink); font-variant-numeric:tabular-nums;}
  .sim-rp{font-size:10.5px; color:var(--ink-faint); margin-top:2px;}

  /* ---------- B · Comparativa de escenarios de política pública (3 arriba + 4 abajo) ---------- */
  .sim-sc-grid{display:flex; flex-direction:column; gap:10px;}
  .sim-sc-row-3{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px;}
  .sim-sc-row-4{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px;}
  @media (max-width:1280px){
    .sim-sc-row-3, .sim-sc-row-4{grid-template-columns:repeat(2, minmax(0, 1fr));}
  }
  @media (max-width:760px){
    .sim-sc-row-3, .sim-sc-row-4{grid-template-columns:1fr;}
  }
  .sim-sc-card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:8px 10px; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:5px; min-width:0;
  }
  .sim-sc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:6px; border-bottom:1px solid var(--border); padding-bottom:4px;}
  .sim-sc-title{font-size:12px; font-weight:700; color:var(--ink);}
  .sim-sc-desc{font-size:10px; color:var(--ink-soft); line-height:1.25;}
  .sim-sc-body{display:flex; flex-direction:column; gap:5px;}
  .sim-sc-params, .sim-sc-result{display:flex; flex-direction:column; gap:2px;}
  .sim-sc-pair{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:7px; align-items:stretch; flex:1;}
  .sim-sc-metric{font-family:var(--font-mono); font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
  .sim-sc-bar{height:4px; border-radius:999px; background:var(--grid-line); overflow:hidden;}
  .sim-sc-side{
    display:flex; flex-direction:column; gap:2px; padding:6px 7px; border-radius:7px;
    background:var(--surface); border:1px solid var(--border); min-width:0; height:100%;
  }
  .sim-sc-side > div:last-child{margin-top:auto !important;}
  .sim-sc-side-hdr{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .sim-cov-bar{height:6px; border-radius:999px; background:var(--grid-line); overflow:hidden;}
  .sim-cov-fill{height:100%; background:linear-gradient(90deg, var(--structure-dim), var(--structure)); border-radius:999px;}
  .sim-cov-lbl{font-size:10.5px; font-family:var(--font-mono); color:var(--ink-soft);}
